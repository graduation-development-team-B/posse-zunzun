name: Deploy preview

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Export and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web app with EAS preview variables
        run: npx eas-cli@latest env:exec preview 'npx expo export --platform web' --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy to EAS Hosting preview
        run: npx eas-cli@latest deploy --non-interactive --environment preview --alias preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
