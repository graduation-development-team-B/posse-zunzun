name: Deploy production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.ref_name, '-') }}
    name: Export and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web app with EAS production variables
        run: npx eas-cli@latest env:exec production 'npx expo export --clear --platform web' --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy to EAS Hosting production
        run: npx eas-cli@latest deploy --non-interactive --environment production --prod
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
